name: python

on:
  push:
    branches: [main]
    paths: ["Python/**", "spec/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["Python/**", "spec/**", ".github/workflows/python.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    defaults:
      run:
        working-directory: Python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=sashiny --cov-report=term-missing
      - run: uv build
      - run: uvx twine check dist/*

sashiny: 1
program: program.sas
title: YAML 1.2 core numbers
# Spec section 1.1: every number below is a YAML 1.2 core number. Under YAML 1.1
# rules `-.5`, `1e5`, `2.5e5` and `0o17` are strings (E000), and `010` is 8 (S003).
inputs:
  shift:
    type: numeric
    label: Shift
    min: -.5
    max: +.5
    default: -.25
  budget:
    type: numeric
    label: Budget
    min: 0
    max: 2.5e5
    default: 1e5
  count:
    type: numeric
    label: Count
    integer: true
    min: 9
    max: 010
    default: 0x9
  code:
    type: text
    label: Code
    max_length: 0o17
    default: "1e5"
outputs:
  log:
    type: log
run:
  timeout_seconds: 6e1

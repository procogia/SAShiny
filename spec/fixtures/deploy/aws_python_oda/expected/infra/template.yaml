# Generated by SAShiny 0.0.0 (CONTRACT.md 6.8.2). Do not edit by hand.
# Standard ECS (Fargate) and ALB resources: ECS Express Mode does not expose target-group
# stickiness or the load balancer idle timeout, which Shiny needs.
# Secrets are Secrets Manager ARNs; no secret value is stored in this file.
AWSTemplateFormatVersion: '2010-09-09'
Description: SAShiny app sashiny-app on Amazon ECS (Fargate) behind an Application Load Balancer.

Parameters:
  ImageUri:
    Type: String
    Description: Container image URI in Amazon ECR.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC of the subnets.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets of the internet-facing load balancer, in at least two Availability Zones.
  CertificateArn:
    Type: String
    Description: ACM certificate ARN of the HTTPS listener.
  SasEgressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR of the SAS hosts, for SAS ports other than 443.
  SasUserSecretArn:
    Type: String
    Description: Secrets Manager ARN of SASHINY_SAS_USER.
  SasPasswordSecretArn:
    Type: String
    Description: Secrets Manager ARN of SASHINY_SAS_PASSWORD.

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: sashiny-app

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/sashiny-app
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'sashiny-app-execution'
      PermissionsBoundary: 'arn:aws:iam::123456789012:policy/sashiny-boundary'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-sas-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref SasUserSecretArn
                  - !Ref SasPasswordSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'sashiny-app-task'
      PermissionsBoundary: 'arn:aws:iam::123456789012:policy/sashiny-boundary'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: sashiny-app load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: sashiny-app tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8591
          ToPort: 8591
          CidrIp: !Ref SasEgressCidr
        - IpProtocol: tcp
          FromPort: 8800
          ToPort: 8999
          CidrIp: !Ref SasEgressCidr

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: sashiny-app
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '3600'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: sashiny-app
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      VpcId: !Ref VpcId
      HealthCheckPath: /
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: 'true'
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: '86400'

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: sashiny-app
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '2048'
      Memory: '4096'
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          User: '10001'
          Essential: true
          HealthCheck:
            Command:
              - CMD-SHELL
              - 'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/'', timeout=4)"'
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: SASHINY_LICENSE_ACK
              Value: 'true'
            - Name: SASHINY_PROFILE
              Value: 'oda'
            - Name: SASHINY_ODA_REGION
              Value: 'us1'
          Secrets:
            - Name: SASHINY_SAS_USER
              ValueFrom: !Ref SasUserSecretArn
            - Name: SASHINY_SAS_PASSWORD
              ValueFrom: !Ref SasPasswordSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: sashiny-app
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup

Outputs:
  Url:
    Description: App address.
    Value: !Sub 'https://${LoadBalancer.DNSName}'
  LoadBalancerDnsName:
    Description: Point your custom domain at this name.
    Value: !GetAtt LoadBalancer.DNSName

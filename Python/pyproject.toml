[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sashiny"
dynamic = ["version"]
description = "Use unchanged SAS programs as the server of Shiny applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mehar Pratap Singh", email = "meharpsingh@gmail.com" }]
maintainers = [{ name = "Mehar Pratap Singh", email = "meharpsingh@gmail.com" }]
keywords = ["sas", "shiny", "saspy", "viya", "dashboard", "clinical", "aml"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.18",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
saspy = ["saspy>=5.100"]
shiny = ["shiny>=1.0"]
upload = ["pandas>=2.0", "openpyxl>=3.1", "pyreadstat>=1.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13"]

[project.urls]
Homepage = "https://github.com/meharpsingh/SAShiny"
Source = "https://github.com/meharpsingh/SAShiny/tree/main/Python"
Issues = "https://github.com/meharpsingh/SAShiny/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "shiny>=1.9.0",
]

[tool.hatch.version]
path = "src/sashiny/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sashiny"]

[tool.hatch.build.targets.sdist]
include = ["src/sashiny", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "D", "S", "PT", "PL"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "saspy", "pandas"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
